services:
  postgres:
    image: postgres:15-alpine
    container_name: tfi_postgres
    environment:
      POSTGRES_DB: tfibagundali
      POSTGRES_USER: tfi_user
      POSTGRES_PASSWORD: tfi_pass
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tfi_user -d tfibagundali']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tfi_redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
